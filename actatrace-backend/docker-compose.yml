name: actatrace

services:
  postgres:
    image: postgres:16-alpine
    container_name: actatrace_postgres
    environment:
      POSTGRES_DB: actatrace
      POSTGRES_USER: actatrace
      POSTGRES_PASSWORD: actatrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - actatrace_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actatrace -d actatrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: actatrace_backend
    env_file:
      - .env.example
    environment:
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: actatrace-documents
      S3_USE_SSL: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    networks:
      - actatrace_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: actatrace_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - actatrace_network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: actatrace_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - actatrace_network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: actatrace_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - actatrace_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: actatrace_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - actatrace_network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/actatrace-documents &&
      mc anonymous set none local/actatrace-documents
      "

volumes:
  postgres_data:
    name: actatrace_postgres_data
  minio_data:
    name: actatrace_minio_data
  prometheus_data:
    name: actatrace_prometheus_data
  grafana_data:
    name: actatrace_grafana_data

networks:
  actatrace_network:
    name: actatrace_network
