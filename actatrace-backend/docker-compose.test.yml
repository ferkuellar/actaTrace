name: actatrace-test

services:
  test-postgres:
    image: postgres:16-alpine
    container_name: actatrace_test_postgres
    environment:
      POSTGRES_DB: actatrace_test
      POSTGRES_USER: actatrace
      POSTGRES_PASSWORD: actatrace
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actatrace -d actatrace_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-test:
    build: .
    container_name: actatrace_backend_test
    environment:
      DATABASE_URL: postgresql+psycopg://actatrace:actatrace@test-postgres:5432/actatrace_test
      JWT_SECRET_KEY: test-secret-not-for-production
      JWT_ALGORITHM: HS256
      JWT_ISSUER: actatrace
      JWT_AUDIENCE: actatrace-api
      ENVIRONMENT: test
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /tmp/actatrace-test-storage
      BLOCKCHAIN_PROVIDER: mock
      ENABLE_RATE_LIMITING: "true"
      ENABLE_METRICS: "true"
    depends_on:
      test-postgres:
        condition: service_healthy
    command: pytest app/tests tests --junitxml=test-results.xml --cov=app --cov-report=xml --cov-report=html

